name: Verify VS Code Extension

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - master
      - dev
      - develop
    paths:
      - ".github/workflows/**"
      - ".gitattributes"
      - ".gitignore"
      - ".vscode/**"
      - "assets/**"
      - "compatibility/**"
      - "samples/**"
      - "scripts/**"
      - "src/**"
      - "themes/**"
      - ".vscodeignore"
      - "CHANGELOG.md"
      - "docs/**"
      - "Makefile"
      - "README.md"
      - "package.json"
      - "package-lock.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run lint

      - name: Validate source and generated theme
        run: npm test

      - name: Build and validate VSIX
        run: npm run package

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: codepen-theme-original-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/codepen-theme-original.vsix
          if-no-files-found: error
          retention-days: 7

  compatibility:
    name: Full provider compatibility
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/compatibility.yml
