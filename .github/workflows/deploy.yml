name: Deploy VS Code Extension

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  #release:
  #  types:
  #    - created

jobs:
  deploy:
    name: "Deploy VS Code Extension"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    timeout-minutes: 15
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        id: node-setup
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install Dependencies
        id: install
        run: |
          npm install
          npm install -g @vscode/vsce

      - name: Publish
        id: publish
        if: success() && startsWith(github.ref, 'refs/tags/')
        run: npm run deploy
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  complete-issues:
    name: Complete issues after successful publication
    needs: [deploy]
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    concurrency:
      group: labels-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Apply semantic release transition
        uses: ziqq/actions/labeler@a991545704ba3fc43380d2b6024db3ca6935e4a7
        with:
          operation: release-completed
          github-token: ${{ github.token }}
          config-source: api
          allow-empty: 'true'
          allow-pattern-removal: 'true'
          max-targets: '100'

  notify:
    name: Notify deploy result
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout trusted notification template
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Notify Discord and Telegram
        uses: ziqq/actions/notify@ccd1a799683cd461a45d9303ac6fcb2792f8f5d2
        with:
          providers: discord,telegram
          template-path: .github/notify/templates/release.md
          variables: |
            {
              "status_label": ${{ toJSON(needs.deploy.result) }}
            }
          failure-policy: required
          timeout-ms: "10000"
          max-attempts: "5"
          discord-webhooks: ${{ secrets.DISCORD_WEBHOOKS }}
          telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram-targets: ${{ secrets.TELEGRAM_TARGETS }}
