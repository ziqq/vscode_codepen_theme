name: Deploy VS Code Extension

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: "Deploy VS Code Extension"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ./
    timeout-minutes: 15
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        id: node-setup
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install Dependencies
        id: install
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Check JavaScript Syntax
        run: npm run lint

      - name: Validate Source
        run: npm test

      - name: Validate Release Tag
        run: npm run check:release -- "${GITHUB_REF_NAME}"

      - name: Prepare release notes
        # Preserve the reviewed CHANGELOG order instead of generating notes from commits.
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const lines = readFileSync('CHANGELOG.md', 'utf8').split(/\r?\n/);
          const heading = lines.indexOf(`## ${version}`);
          if (heading < 0) throw new Error(`Missing CHANGELOG section for ${version}`);
          const section = lines.slice(heading + 1);
          const next = section.findIndex((line) => line.startsWith('## '));
          const notes = section.slice(0, next < 0 ? section.length : next).join('\n').trim();
          if (!notes) throw new Error(`Empty CHANGELOG section for ${version}`);
          writeFileSync(path.join(process.env.RUNNER_TEMP, 'codepen-release-notes.md'), `${notes}\n`);
          NODE

      - name: Validate Package
        run: npm run package

      - name: Publish
        id: publish
        if: success() && startsWith(github.ref, 'refs/tags/')
        # A retry can still upload the GitHub asset after Marketplace publication succeeded.
        run: npm run deploy -- --skip-duplicate
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish GitHub Release and VSIX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Reuse the exact package validated and published to Marketplace above.
          asset="build/codepen-theme-original.vsix"
          notes="${RUNNER_TEMP}/codepen-release-notes.md"
          title="CodePen Theme Original ${GITHUB_REF_NAME}"
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "$asset" --clobber --repo "${GITHUB_REPOSITORY}"
            gh release edit "${GITHUB_REF_NAME}" --title "$title" --notes-file "$notes" --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" "$asset" --verify-tag --title "$title" --notes-file "$notes" --repo "${GITHUB_REPOSITORY}"
          fi
