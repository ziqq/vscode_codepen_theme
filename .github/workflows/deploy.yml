name: Deploy VS Code Extension

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  #release:
  #  types:
  #    - created

permissions:
  contents: read

jobs:
  deploy:
    name: "Deploy VS Code Extension"
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: ./
    timeout-minutes: 15
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate release source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            echo "::error::Releases require an existing tag."
            exit 1
          fi
          git fetch --no-tags origin "$GITHUB_REF"
          tag_commit="$(git rev-parse 'FETCH_HEAD^{commit}')"
          test "$(git rev-parse HEAD)" = "$tag_commit"
          git fetch --no-tags origin refs/heads/master
          git merge-base --is-ancestor "$tag_commit" FETCH_HEAD

      - name: Install Node.js
        id: node-setup
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x

      - name: Validate release tag
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const changelogVersion = changelog.match(/^##\s+(\S+)/m)?.[1];
          if (process.env.GITHUB_REF_TYPE !== 'tag' ||
              process.env.GITHUB_REF_NAME !== `v${version}` ||
              changelogVersion !== version) {
            console.error('The release tag, package.json and first changelog version must match.');
            process.exit(1);
          }
          console.log(`Validated existing release tag v${version}.`);
          NODE

      - name: Install Dependencies
        id: install
        # The project lockfile supplies the audited OIDC-capable packager.
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Check JavaScript Syntax
        run: npm run lint

      - name: Build generated runtime
        run: npm run build

      - name: Validate Source
        run: npm test

      - name: Prepare release notes
        # Preserve the reviewed CHANGELOG order instead of generating notes from commits.
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const lines = readFileSync('CHANGELOG.md', 'utf8').split(/\r?\n/);
          const heading = lines.indexOf(`## ${version}`);
          if (heading < 0) throw new Error(`Missing CHANGELOG section for ${version}`);
          const section = lines.slice(heading + 1);
          const next = section.findIndex((line) => line.startsWith('## '));
          const notes = section.slice(0, next < 0 ? section.length : next).join('\n').trim();
          if (!notes) throw new Error(`Empty CHANGELOG section for ${version}`);
          writeFileSync(path.join(process.env.RUNNER_TEMP, 'codepen-release-notes.md'), `${notes}\n`);
          NODE

      - name: Validate Package
        run: npm run package

      - name: Publish
        id: publish
        if: success() && startsWith(github.ref, 'refs/tags/')
        # Retries may finish GitHub Release publication after Marketplace succeeded.
        run: npm run deploy -- --oidc --skip-duplicate

      - name: Publish GitHub Release and VSIX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Reuse the exact package validated and published to Marketplace above.
          asset="build/codepen-theme-original.vsix"
          notes="${RUNNER_TEMP}/codepen-release-notes.md"
          title="CodePen Theme Original ${GITHUB_REF_NAME}"
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "$asset" --clobber --repo "${GITHUB_REPOSITORY}"
            gh release edit "${GITHUB_REF_NAME}" --title "$title" --notes-file "$notes" --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" "$asset" --verify-tag --title "$title" --notes-file "$notes" --repo "${GITHUB_REPOSITORY}"
          fi

  complete-issues:
    name: Complete issues after successful publication
    needs: [deploy]
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    concurrency:
      group: labels-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Apply semantic release transition
        uses: ziqq/actions/labeler@a991545704ba3fc43380d2b6024db3ca6935e4a7
        with:
          operation: release-completed
          github-token: ${{ github.token }}
          config-source: api
          allow-empty: 'true'
          allow-pattern-removal: 'true'
          max-targets: '100'

  notify:
    name: Notify deploy result
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout trusted notification template
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Notify Discord and Telegram
        uses: ziqq/actions/notify@ccd1a799683cd461a45d9303ac6fcb2792f8f5d2
        with:
          providers: discord,telegram
          template-path: .github/notify/templates/release.md
          variables: |
            {
              "status_label": ${{ toJSON(needs.deploy.result) }}
            }
          failure-policy: required
          timeout-ms: "10000"
          max-attempts: "5"
          discord-webhooks: ${{ secrets.DISCORD_WEBHOOKS }}
          telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram-targets: ${{ secrets.TELEGRAM_TARGETS }}
