# Keys, escaped separators, continuations, substitutions, and Unicode escapes.
theme.name=CodePen Theme Original
theme.accent=#96b38a
theme.background=#1d1e22
theme.enabled=true
theme.editor.font-size=15
theme.editor.font-family=Operator Mono Lig, Operator Mono, Monaco, monospace

token.keyword.color=#ddca7e
token.string.color=#96b38a
token.comment.color=#717790

preview.command=code --extensionDevelopmentPath\=.
preview.files=main.ts,main.dart,Makefile
preview.description=${theme.name} uses \
  semantic tokens and TextMate scopes.
escaped\ key=escaped\ value
unicode.label=Twilight \u2605
