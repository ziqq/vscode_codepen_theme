<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CodePen Theme Sample</title>
    <style>
      :root { color-scheme: dark; }
      .preview[data-theme="codepen"] { color: #96b38a; background: #1d1e22; }
      .token-list li::marker { color: #ddca7e; }
    </style>
  </head>
  <body>
    <main class="preview" data-theme="codepen">
      <h1>CodePen Theme Original</h1>
      <p id="status">Theme-only package with provider-owned grammars.</p>
      <ul class="token-list" aria-label="Theme tokens">
        <li data-color="#ddca7e">keywords</li>
        <li data-color="#96b38a">strings</li>
        <li data-color="#717790">comments</li>
      </ul>
      <button type="button" data-action="preview">Preview palette</button>
    </main>
    <script>
      const preview = document.querySelector('[data-action="preview"]');
      preview?.addEventListener('click', () => {
        document.querySelector('#status').textContent = 'Preview ready';
      });
    </script>
    <details open>
      <summary>Provider contract</summary>
      <dl>
        <dt>Grammar</dt>
        <dd><code>text.html.derivative</code></dd>
        <dt>Status</dt>
        <dd><meter min="0" max="68" value="68">68 of 68</meter></dd>
      </dl>
    </details>
    <template id="token-template">
      <li><mark data-role="token">token</mark></li>
    </template>
    <!-- Extended showcase: forms, media, inline script and style. -->
    <form action="/themes" method="post" class="theme-form" novalidate>
      <fieldset>
        <legend>Pick a token color</legend>
        <label for="role">Role</label>
        <select id="role" name="role" required>
          <option value="keyword" selected>Keyword</option>
          <option value="string">String</option>
        </select>
        <input type="color" id="color" name="color" value="#96b38a" aria-describedby="color-hint">
        <small id="color-hint">Hex color &mdash; e.g. <code>#ddca7e</code></small>
        <input type="checkbox" id="italic" name="italic" checked disabled>
        <button type="submit" data-action="save" onclick="return confirm('Save?')">Save</button>
      </fieldset>
    </form>
    <table>
      <thead><tr><th scope="col">Role</th><th scope="col">Color</th></tr></thead>
      <tbody><tr><td>comment</td><td style="color: #717790">#717790</td></tr></tbody>
    </table>
    <picture>
      <source srcset="preview.avif" type="image/avif">
      <img src="preview.png" alt="Theme preview" width="640" height="360" loading="lazy">
    </picture>
    <style>
      .theme-form :is(input, select):focus-visible { outline: 2px solid var(--accent, #96b38a); }
    </style>
    <script type="module">
      const form = document.querySelector('.theme-form');
      form?.addEventListener('submit', async (event) => {
        event.preventDefault();
        const data = Object.fromEntries(new FormData(form));
        await fetch(form.action, { method: 'POST', body: JSON.stringify(data) });
      });
    </script>
  </body>
</html>
