<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CodePen Theme Sample</title>
    <style>
      :root { color-scheme: dark; }
      .preview[data-theme="codepen"] { color: #96b38a; background: #1d1e22; }
      .token-list li::marker { color: #ddca7e; }
    </style>
  </head>
  <body>
    <main class="preview" data-theme="codepen">
      <h1>CodePen Theme Original</h1>
      <p id="status">Theme-only package with provider-owned grammars.</p>
      <ul class="token-list" aria-label="Theme tokens">
        <li data-color="#ddca7e">keywords</li>
        <li data-color="#96b38a">strings</li>
        <li data-color="#717790">comments</li>
      </ul>
      <button type="button" data-action="preview">Preview palette</button>
    </main>
    <script>
      const preview = document.querySelector('[data-action="preview"]');
      preview?.addEventListener('click', () => {
        document.querySelector('#status').textContent = 'Preview ready';
      });
    </script>
  </body>
</html>
