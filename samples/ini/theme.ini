; Sections, dotted keys, quoted values, numbers, booleans, and substitutions.
[theme]
name = CodePen Theme Original
accent = #96b38a
background = #1d1e22
enabled = true
font_size = 15

[theme.tokens]
keyword = #ddca7e
string = #96b38a
comment = #717790

[preview]
command = "code --extensionDevelopmentPath=."
files = *.ts, *.dart, Makefile
inherit = ${theme:name}

[database "cache"]
path = /tmp/codepen-theme.sqlite
read_only = yes
